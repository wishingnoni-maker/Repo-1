name: Build and deploy Node.js app to Azure Web App - workforce-hub-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install, build, and prune server
        run: |
          npm ci --workspace server
          npm run build --workspace server
          rm -rf node_modules
          npm ci --omit=dev --workspace server

      - name: Create clean deployment folder
        run: |
          rm -rf deploy
          mkdir deploy
          cp server/package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp -R server/dist deploy/dist
          cp -R node_modules deploy/node_modules
          if [ -d server/data ]; then cp -R server/data deploy/data; fi

      - name: Verify deployment folder
        run: |
          echo "Current folder:"
          pwd
          echo "Deploy folder:"
          ls -la deploy
          echo "Dist folder:"
          ls -la deploy/dist
          echo "Required file checks:"
          test -f deploy/package.json
          test -f deploy/package-lock.json
          test -f deploy/dist/index.js
          test -d deploy/node_modules
          test -d deploy/node_modules/dotenv
          test -d deploy/node_modules/express
          test -d deploy/node_modules/cors
          if [ -d deploy/data ]; then ls -la deploy/data; fi
          cd deploy
          node -e "import('dotenv').then(() => console.log('dotenv import ok'))"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "workforce-hub-api"
          slot-name: "Production"
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1D02B99A932F4C4CAC7394B20AF1DA3A }}
